<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oven Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <span class="app-header-title">Oven Monitor</span>
    <div class="app-header-meta">
      <span id="oven-picker-wrap" class="app-header-subtitle"></span>
      <span id="last-updated" class="app-header-subtitle">connecting...</span>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="status-row">
        <span id="state-badge" class="badge UNKNOWN">UNKNOWN</span>
        <div>
          <div id="oven-name" style="font-weight: 700;">-</div>
          <div id="status-reason" class="status-reason">-</div>
        </div>
      </div>
      <div id="stale-banner" class="banner hidden"></div>
    </section>

    <section class="card" id="job-card">
      <h2>Current job</h2>
      <div id="job-content"></div>
    </section>

    <section class="card" id="faults-card">
      <h2>Faults</h2>
      <div id="faults-grid" class="probe-grid"></div>
      <p class="footnote" id="faults-note"></p>
    </section>

    <section class="card">
      <h2>Key indicators</h2>
      <div id="tile-grid" class="tile-grid"></div>
    </section>

    <section class="card">
      <h2>Temperature trend</h2>
      <div class="table-tools">
        <select id="chart-mode">
          <option value="live">Live &mdash; last 6h</option>
        </select>
        <span id="chart-range-label" class="footnote" style="margin:0;"></span>
      </div>
      <div id="temp-chart-container"></div>
    </section>

    <section class="card" id="probe-card">
      <h2>Load thermocouples</h2>
      <div id="probe-grid" class="probe-grid"></div>
      <p class="footnote" id="probe-note"></p>
    </section>

    <details class="card">
      <summary><h2>Tag monitor</h2></summary>
      <div class="table-tools" style="margin-top:0.85rem;">
        <input type="search" id="tag-filter" placeholder="Filter by field or PLC tag...">
        <label><input type="checkbox" id="only-flagged"> Only flagged</label>
        <label><input type="checkbox" id="group-tags" checked> Group</label>
      </div>
      <div class="overflow-wrap">
        <table id="tag-table">
          <thead>
            <tr>
              <th>Field</th>
              <th>PLC tag</th>
              <th>Value</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="footnote">
        Raw PLC readings, no polarity correction applied. <span class="flag">polarity?</span>
        marks bits whose wiring is still unconfirmed.
      </p>
    </details>

    <section class="card">
      <h2>Observed state, last 24h</h2>
      <div id="state-summary"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
